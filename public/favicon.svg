<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="kb-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB45E" />
      <stop offset="60%" stop-color="#F46A35" />
      <stop offset="100%" stop-color="#DC5425" />
    </linearGradient>
    <linearGradient id="kb-accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F46A35" />
      <stop offset="100%" stop-color="#FFD6A5" />
    </linearGradient>
    <filter id="kb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F46A35" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#171D2A" stroke="#2E3442" stroke-width="1.5" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="#12141B" fill-opacity="0.9" />

  <!-- Stadium Energy Arc / Halo -->
  <path d="M14 26 C14 18, 50 18, 50 26 C50 38, 14 38, 14 50" stroke="#FFB45E" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3" />

  <!-- Dynamic 'K' Sports Athlete Emblem -->
  <!-- Main Vertical Kinetic Stem -->
  <rect x="18" y="15" width="7" height="34" rx="3.5" fill="url(#kb-orange-grad)" filter="url(#kb-shadow)" />

  <!-- Upper Diagonal Wing (Ascending Jump / Motion) -->
  <path d="M25 31 L39 17 C40.5 15.5 43.5 16.5 43.5 18.8 L43.5 21.5 C43.5 22.8 42.8 24 41.5 25.2 L32 34 Z" fill="url(#kb-accent-glow)" />

  <!-- Lower Diagonal Sprint Wing (Ground Drive) -->
  <path d="M26.5 32.5 L41.5 46.5 C42.8 47.8 45 47.2 45.2 45.2 L45.2 42.8 C45.2 41.5 44.5 40.2 43.5 39.2 L34.5 29.5 Z" fill="url(#kb-orange-grad)" />

  <!-- Kinetic Sports Energy Spark / Ball Indicator -->
  <circle cx="36" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="36" cy="32" r="2" fill="#F46A35" />
</svg>